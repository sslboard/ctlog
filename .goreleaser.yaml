version: 2

project_name: ctlog

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: ctlog
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# brew install sslboard/tap/ctlog. Needs the sslboard/homebrew-tap repository
# and a HOMEBREW_TAP_GITHUB_TOKEN secret with write access to it. GoReleaser
# only accepts the token as a bare {{ .Env.NAME }} template, so the upload is
# skipped when the variable is empty rather than when it is missing.
homebrew_casks:
  - name: ctlog
    binaries: [ctlog]
    repository:
      owner: sslboard
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://sslboard.com/docs/ctlog/
    description: List hostnames from Certificate Transparency logs
    license: MIT
    commit_author:
      name: sslboard-bot
      email: contact@sslboard.com
    hooks:
      post:
        # The binaries are not notarized; drop the quarantine flag so macOS
        # runs them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ctlog"]
          end
